<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puma</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <header class="navbar">
        <div class="left-side">
            <div class="logo">
                <img src="/logo/puma-se--eps--vector-logo.png" alt="">
            </div>
            <nav class="menu">
                <a href="">New</a>
                <a href="">Sports</a>
                <a href="">Men</a>
                <a href="">Women</a>
                <a href="">Motosport</a>
                <a href="">Lifestyle</a>
                <a href="">Kids</a>
                <a href="">Sale</a>
            </nav>
        </div>
        <div class="right-side">
            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" name="" id="" placeholder="SEARCH">
            </div>
            <i class="far fa-heart"></i>
            <i class="fas fa-shopping-bag"></i>
            <i class="far fa-user"></i>
        </div>
    </header>

    <main>
        <section class="hero">
            <!-- <img src="./images/690f7c5e5c61c5df5cb57fe845d5b43516faea6d.avif" alt=""> -->

            <div class="hero-content">
                <h1>EXTRA 15% OFF <br>ON EVERYTHING*</h1>

                <div class="hero-buttons">
                    <button class="btn">FOR HIM</button>
                    <button class="btn">FOR HER</button>
                </div>
            </div>
        </section>

        <section class="category">
            <h2>JET SET IN STYLE</h2>
                <div class="category-list">
                    <a href="" class="category-item">ALL DAY COMFORT SHOES</a>
                    <a href="" class="category-item">BAGS</a>
                    <a href="" class="category-item">SLIDES & SANDALS</a>
                    <a href="" class="category-item">DAILY DRIP TEES</a>
                    <a href="" class="category-item">OFF-DUTY FITS</a>
                    <a href="" class="category-item">KIDS</a>
                </div>
        </section>
    </main>
</body>
</html>
